version: "2"
run:
  tests: false
  timeout: 5m

linters:
  default: all
  disable:
    - depguard
    - exhaustruct # replaced by exhaustruct_v5
    - gomodguard # replaced by gomodguard_v2
    - wsl # replaced by wsl_v5
  settings:
    wsl_v5:
      allow-first-in-block: true
      allow-whole-block: false
      branch-max-lines: 2